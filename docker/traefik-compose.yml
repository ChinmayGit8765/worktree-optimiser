# The manager starts Traefik on its own; this file is here for when you'd rather
# run the proxy yourself (systemd, a shared dev box, or alongside other stacks).
#
#   docker compose -f docker/traefik-compose.yml up -d
#
# The manager detects the existing `wt-traefik` container and leaves it alone.

services:
  traefik:
    image: traefik:v3.3
    container_name: wt-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=wt-net
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "${WT_HTTP_PORT:-80}:80"
      - "${WT_TRAEFIK_DASHBOARD_PORT:-8088}:8080"
    volumes:
      # Read-only: Traefik only ever needs to watch container events.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      wt.managed: "true"
      wt.role: proxy
    networks:
      - wt-net

networks:
  wt-net:
    name: wt-net
    driver: bridge
