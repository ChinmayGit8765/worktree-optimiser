name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  integration:
    name: docker integration
    runs-on: ubuntu-latest
    # Separate job: needs a live Docker daemon, pulls images, and takes minutes.
    # A unit-test failure should be visible without waiting for it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Preflight
        # Runs before the suite so an environment problem is reported as an
        # environment problem rather than as a mysterious test failure.
        run: npm run doctor
        env:
          # The runner's daemon is native Linux, so bind paths pass through.
          WT_BIND_STYLE: unix

      - name: Integration tests
        run: npm run test:integration
        env:
          WT_BIND_STYLE: unix

      - name: Container diagnostics on failure
        if: failure()
        run: |
          docker ps -a --filter label=wt.managed=true
          for c in $(docker ps -aq --filter label=wt.managed=true); do
            echo "===== $c ====="
            docker logs --tail 100 "$c" 2>&1 || true
          done

      - name: Clean up
        if: always()
        run: |
          docker ps -aq --filter label=wt.managed=true | xargs -r docker rm -f
          docker volume ls -q --filter name=wt-vol- | xargs -r docker volume rm
